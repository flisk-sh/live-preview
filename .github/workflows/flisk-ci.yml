# Shared Flisk CI from flisk-sh/.github: CodeQL.
name: Flisk CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1" # weekly CodeQL, so new vulnerability queries reach code that has not changed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flisk-ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tunnel-logs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/tunnel.test.sh

  codeql:
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: flisk-sh/.github/.github/workflows/codeql.yml@b5eeea945364038cd2143e9676b77fc9af293dfa # v1.4.0
